services:
  # TRADELOG Frontend (Static Site)
  - type: web
    name: tradelog-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # If the backend is also on Render, we can use the backend's URL here via environment variables,
    # but the frontend is built statically, so the API URL is usually burned in at build time.
    # Alternatively, you can configure VITE_API_URL in the Render dashboard for the frontend.
    envVars:
      - key: VITE_API_URL
        value: https://tradelog-backend.onrender.com/api

  # TRADELOG Backend (Web Service)
  - type: web
    name: tradelog-backend
    env: node
    buildCommand: npm install && npm run prisma:generate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set this in Render Dashboard (e.g., PostgreSQL or SQLite absolute path if attached disk)
      - key: JWT_SECRET
        sync: false # Set this in Render Dashboard
